    html,body{height:100%;overflow:hidden;}
    @media (max-width: 374px) {
      :root { --fs-body: 13px; --fs-hero: 28px; --fs-title: 18px; --card-pad: 12px; --nav-h: 60px; }
    }
    @media (min-width: 375px) and (max-width: 413px) {
      :root { --fs-body: 14px; --fs-hero: 32px; --fs-title: 20px; --card-pad: 14px; --nav-h: 64px; }
    }
    @media (min-width: 414px) {
      :root { --fs-body: 15px; --fs-hero: 36px; --fs-title: 22px; --card-pad: 16px; --nav-h: 68px; }
    }
    /* Focus Mode */
    .focus-mode .wkt-non-focus { display: none !important; }
    .focus-mode .wkt-focus-only { display: flex !important; }
    .focus-mode .ex-card { border-color: rgba(var(--c1-rgb), 0.25); }
    .focus-mode .set-inp { font-size: 18px !important; min-height: 42px !important; }
    .focus-mode .ex-card-header { padding-bottom: 4px; }

    /* ── Premium Animations ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.92); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(24px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.04); }
    }
    @keyframes shimmer {
      0%   { background-position: -200% 0; }
      100% { background-position:  200% 0; }
    }
    @keyframes celebrationBounce {
      0%   { transform: scale(1); }
      30%  { transform: scale(1.2); }
      60%  { transform: scale(0.95); }
      80%  { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
    .anim-fade-up  { animation: fadeUp  0.32s cubic-bezier(.22,1,.36,1) both; }
    .anim-fade-in  { animation: fadeIn  0.24s ease both; }
    .anim-scale-in { animation: scaleIn 0.28s cubic-bezier(.22,1,.36,1) both; }
    .anim-slide-r  { animation: slideInRight 0.28s cubic-bezier(.22,1,.36,1) both; }
    .anim-pulse    { animation: pulse 2s ease-in-out infinite; }
    .stagger > * { animation: fadeUp 0.32s cubic-bezier(.22,1,.36,1) both; animation-delay: calc(var(--i, 0) * 60ms); }
    .skeleton {
      background: linear-gradient(90deg, var(--bg3) 25%, rgba(255,255,255,0.06) 50%, var(--bg3) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 10px;
    }
    .press { transition: transform 0.18s var(--spring, cubic-bezier(0.34, 1.56, 0.64, 1)), opacity 0.14s ease; }
    .press:active { transform: scale(0.92); opacity: 0.85; }
    .card-press { transition: transform 0.18s var(--spring, cubic-bezier(0.34, 1.56, 0.64, 1)), box-shadow 0.18s ease; }
    .card-press:active { transform: scale(0.96); box-shadow: var(--ds1, 0 2px 8px rgba(0,0,0,0.3)); }
    .screen-enter { opacity: 0; transform: translateY(12px); transition: opacity 0.28s cubic-bezier(.22,1,.36,1), transform 0.32s cubic-bezier(.22,1,.36,1); }
    .screen-enter-active { opacity: 1; transform: translateY(0); }
    .screen-exit { opacity: 0; transform: translateY(-8px); transition: opacity 0.2s ease, transform 0.22s ease; pointer-events: none; position: absolute; inset: 0; }
    #celebration-overlay {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      pointer-events: none;
      background: rgba(0,0,0,0.5);
    }
    #celebration-overlay .cel-icon {
      font-size: 80px;
      animation: celebrationBounce 0.6s cubic-bezier(.22,1,.36,1) both;
    }
    #celebration-overlay .cel-title {
      font-size: 28px; font-weight: 900; color: #fff;
      margin-top: 16px;
      animation: fadeUp 0.4s 0.2s cubic-bezier(.22,1,.36,1) both;
    }
    #celebration-overlay .cel-sub {
      font-size: 14px; color: rgba(255,255,255,0.7);
      margin-top: 8px;
      animation: fadeUp 0.4s 0.35s cubic-bezier(.22,1,.36,1) both;
    }
    .no-scroll::-webkit-scrollbar { display: none; }
    .no-scroll { scrollbar-width: none; }
  </style>

<script>
function updateOfflineBanner() {
  var banner = document.getElementById('offline-banner');
  if (!banner) return;
  if (navigator.onLine) banner.setAttribute('hidden', '');
  else banner.removeAttribute('hidden');
}
window.addEventListener('online', updateOfflineBanner);
window.addEventListener('offline', updateOfflineBanner);
updateOfflineBanner();
window.updateOfflineBanner = updateOfflineBanner;
</script>

  <script>
    (function() {
      var SPLASH_MS = 0;
      var t0 = performance.now();
      window._bootAfterSplash = function(fn) {
        var wait = Math.max(0, SPLASH_MS - (performance.now() - t0));
        setTimeout(function() {
          var splash = document.getElementById('boot-splash');
          if (splash) splash.classList.add('clipboard-splash--out');
          setTimeout(function() {
            fn();
            document.documentElement.setAttribute('data-boot-ready', 'true');
            window.dispatchEvent(new CustomEvent('pulsecap:ready'));
          }, 180);
        }, wait);
      };
    })();
    S.init();
    const _isDemo = bootDemoIfRequested();
    if (typeof bootOwnerSeed === 'function') bootOwnerSeed();
    const _savedTheme = S.g('user.theme') || S.g('user.mode');
    if (_savedTheme) applyTheme(_savedTheme);
    else applySystemTheme();
    buildNav();
    if (typeof GymFloor !== 'undefined') GymFloor.apply();
    if (typeof loadCustomExercises === 'function') loadCustomExercises();
    if (typeof ExerciseLibrary !== 'undefined') ExerciseLibrary.mergeIntoExDB();
    const _hasDeepLink = typeof bootDeepLink === 'function' && bootDeepLink();
    _bootAfterSplash(function() {
      if (typeof currentScreenId === 'function' && currentScreenId()) return;
      if (_hasDeepLink && typeof runPendingDeepLink === 'function' && runPendingDeepLink()) return;
      if (_isDemo || S.g('onboarded')) go('dashboard');
      else go('intro');
    });
    var _deferredInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      _deferredInstallPrompt = e;
      var visits = parseInt(localStorage.getItem('fos_visits')||'0') + 1;
      localStorage.setItem('fos_visits', visits);
      if (visits >= 3 && !localStorage.getItem('fos_installed')) {
        setTimeout(function() {
          var banner = document.createElement('div');
          banner.id = 'install-banner';
          banner.style.cssText = 'position:fixed;bottom:calc(var(--nav-h,64px) + var(--safe,0px) + 8px);left:16px;right:16px;background:var(--bg3);border:1px solid var(--border2);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px;z-index:888;box-shadow:0 8px 32px rgba(0,0,0,0.3);animation:entryIn 0.3s ease';
          banner.innerHTML = '<div style="flex-shrink:0">' + (typeof iconTile === 'function' ? iconTile('sparkles', 'c1', 40) : '') + '</div><div style="flex:1"><div style="font-size:13px;font-weight:700;color:var(--txt)">Add to Home Screen</div><div style="font-size:11px;color:var(--txt3)">Install PulseCap for the best experience</div></div><button type="button" onclick="_installPWA()" style="background:var(--grad);color:#fff;border:none;border-radius:10px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;touch-action:manipulation">Install</button><button type="button" aria-label="Dismiss" onclick="document.getElementById(\'install-banner\').remove();localStorage.setItem(\'fos_installed\',\'dismissed\')" style="background:none;border:none;color:var(--txt3);font-size:18px;cursor:pointer;padding:4px;touch-action:manipulation">×</button>';
          document.body.appendChild(banner);
        }, 2000);
      }
    });
    window.addEventListener('appinstalled', function() {
      localStorage.setItem('fos_installed', 'true');
      var b = document.getElementById('install-banner');
      if (b) b.remove();
    });
    window._installPWA = function() {
      if (!_deferredInstallPrompt) return;
      _deferredInstallPrompt.prompt();
      _deferredInstallPrompt.userChoice.then(function(r) {
        if (r.outcome === 'accepted') { localStorage.setItem('fos_installed','true'); toast('PulseCap installed','ok'); }
        _deferredInstallPrompt = null;
        var b = document.getElementById('install-banner'); if (b) b.remove();
      });
    };
    (function showIOSInstallGuidance() {
      var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
      var standalone = window.matchMedia && window.matchMedia('(display-mode: standalone)').matches;
      if (!isIOS || standalone || navigator.standalone || localStorage.getItem('fos_ios_install_dismissed')) return;
      var visits = parseInt(localStorage.getItem('fos_ios_visits') || '0', 10) + 1;
      localStorage.setItem('fos_ios_visits', String(visits));
      if (visits < 2) return;
      setTimeout(function() {
        if (document.getElementById('install-banner')) return;
        var banner = document.createElement('div');
        banner.id = 'install-banner';
        banner.setAttribute('role', 'status');
        banner.style.cssText = 'position:fixed;bottom:calc(var(--nav-h,64px) + var(--safe,0px) + 8px);left:16px;right:16px;background:var(--bg3);border:1px solid var(--border2);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px;z-index:888';
        banner.innerHTML = '<div style="flex:1"><div style="font-size:13px;font-weight:700;color:var(--txt)">Install PulseCap</div><div style="font-size:11px;color:var(--txt3);line-height:1.4">In Safari, tap Share, then Add to Home Screen.</div></div><button type="button" aria-label="Dismiss install guidance" style="min-width:44px;min-height:44px;background:none;border:none;color:var(--txt3);font-size:20px">×</button>';
        banner.querySelector('button').addEventListener('click', function() {
          localStorage.setItem('fos_ios_install_dismissed', 'true');
          banner.remove();
        });
        document.body.appendChild(banner);
      }, 1200);
    })();
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js?v=118').then(function(reg) {
        var updateReloadRequested = false;
        reg.update();
        function showUpdate() {
          if (!reg.waiting || document.getElementById('update-banner')) return;
          var banner = document.createElement('div');
          banner.id = 'update-banner';
          banner.setAttribute('role', 'status');
          banner.style.cssText = 'position:fixed;top:calc(12px + var(--top-safe));left:16px;right:16px;z-index:10001;background:var(--bg3);border:1px solid var(--border2);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px';
          banner.innerHTML = '<div style="flex:1;font-size:13px;color:var(--txt)">PulseCap update ready</div><button type="button" class="btn btn-primary btn-sm">Reload</button><button type="button" class="btn btn-ghost btn-sm" aria-label="Dismiss update">Later</button>';
          var buttons = banner.querySelectorAll('button');
          buttons[0].addEventListener('click', function() {
            updateReloadRequested = true;
            if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
          });
          buttons[1].addEventListener('click', function() { banner.remove(); });
          document.body.appendChild(banner);
        }
        if (reg.waiting) showUpdate();
        reg.addEventListener('updatefound', function() {
          var w = reg.installing;
          if (!w) return;
          w.addEventListener('statechange', function() {
            if (w.state === 'installed' && navigator.serviceWorker.controller) showUpdate();
          });
        });
        var refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          if (refreshing || !updateReloadRequested) return;
          refreshing = true;
          location.reload();
        });
      }).catch(function() {
        if (typeof toast === 'function') toast('Offline setup failed. Stay online and reload to retry.', 'warn', 5000);
      });
    }
  </script>
