name: PulseCap CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results
          retention-days: 7

  # C-31: FINISH_MATRIX=1 required (see capricorn-tooling/shared/testing/FINISH-MATRIX-CI.md).
  finish-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit firefox
      - name: Finish matrix
        env:
          FINISH_MATRIX: "1"
        run: npm run test:matrix
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finish-matrix-shots
          path: qa/finish-loop/shots/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matrix-results
          path: qa/finish-loop/matrix-results.json
          retention-days: 14

  deploy-pages:
    needs: [verify, finish-matrix]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage allowlisted site (C-57)
        env:
          ALLOW_PATHS: >-
            index.html landing.html pitch.html presentation.html privacy.html
            changelog.html screen-gallery.html
            sw.js manifest.json VERSION.json
            css js assets icons
            apple-touch-icon.png mark.svg icon.svg
            icon-48.png icon-72.png icon-96.png icon-128.png icon-144.png
            icon-152.png icon-167.png icon-180.png icon-192.png icon-256.png
            icon-384.png icon-512.png icon-1024.png
            icon-maskable-192.png icon-maskable-512.png
          FORBIDDEN_EXTRA: scripts docs qa
        run: bash scripts/stage-pages-site.sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@v4
